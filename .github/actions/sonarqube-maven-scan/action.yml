name: 'Backend SonarQube Analysis'
description: 'Checks out code, sets up Java, loads caches, and runs SonarQube analysis'

inputs:
  sonar_token:
    description: 'Sonar token passed from workflow'
    required: true
  sonar_host_url:
    description: 'Sonar host URL passed from workflow'
    required: true
  enforce_quality_gate:
    description: 'Whether to fail the job if the Sonar Quality Gate fails. Set to false for branch analysis where no gate should apply (e.g. main).'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Build and analyze
      shell: bash
      run: |
        mvn compile sonar:sonar \
        -DskipTests \
        -Dsonar.token=${{ inputs.sonar_token }} \
        -Dsonar.host.url=${{ inputs.sonar_host_url }}

    - name: Sonar Quality Gate
      if: inputs.enforce_quality_gate == 'true'
      id: sonarqube-quality-gate-check
      uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
      with:
        scanMetadataReportFile: target/sonar/report-task.txt
      env:
        SONAR_TOKEN: ${{ inputs.sonar_token }}