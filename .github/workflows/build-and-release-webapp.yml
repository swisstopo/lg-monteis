name: Build and Package Webapp Artifact
run-name: "Build & Package Webapp (manual): ${{ inputs.commit }}"

# ⚠️ FEATURE-BRANCH VARIANT — manual builds only.
# This copy replaces the production push/tag flow with a single manual trigger:
# build & publish a specific already-merged webapp commit to the artifact bucket,
# keyed by the commit SHA (the same key deploy-webapp resolves by). No git tag is
# cut. Intended to live on a feature branch and be run via the Actions
# "Use workflow from" selector — NOT merged to main (main keeps the push flow).

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'CommitSHA of an (already-merged) webapp change to build & push.'
        required: true
        type: string

permissions:
  id-token: write # required for: aws-actions/configure-aws-credentials (OIDC)
  contents: read  # required for: actions/checkout

env:
  JAVA_VERSION: ${{ vars.JAVA_VERSION }}
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION }}
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  build-and-package:
    name: Build & Package webapp
    runs-on: ubuntu-24.04
    steps:
      - name: "[PREPARE]: Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }} # the commit to build; checkout fails clearly if it does not exist
          fetch-depth: 0            # need tags to reuse the commit's webapp-v* version
          filter: blob:none

      - name: "[RESOLVE]: Version from commit"
        id: ver
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --verify "HEAD^{commit}")
          # Reuse the webapp-v* tag on the commit so the artifact keeps its real
          # version + key (idempotent with the push flow's object). Fall back to a
          # manual version for an untagged commit.
          TAG=$(git tag --points-at "$SHA" --list 'webapp-v*' | head -n1)
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#webapp-v}"
          else
            VERSION="0.0.0-manual.${SHA:0:7}"
            TAG="manual"
          fi
          {
            echo "sha=${SHA}"
            echo "version=${VERSION}"
            echo "version_tag=${TAG}"
          } >> "${GITHUB_OUTPUT}"
          echo "Building ${{ inputs.commit }} → ${SHA} (version ${VERSION})"

      - name: "[PREPARE]: Setup Java Environment"
        uses: ./.github/actions/setup-java-maven

      - name: "[PREPARE]: Setup Node Environment"
        uses: ./.github/actions/setup-node-pnpm

      # webapp's generated API client (src/app/core/generated, gitignored) is generated from
      # core's OpenAPI spec, so core must be built first (same as pr-gate.yml).
      - name: "[GENERATE]: Compile Internal Dependencies"
        run: mvn -T 2C install -DskipTests -Dopenapi.codegen.skip=false

      - name: "[GENERATE]: Generate API Client"
        working-directory: webapp
        run: pnpm exec openapi-generator-cli generate -g typescript-angular -i ../core/target/openapi/openapi.json -o src/app/core/generated

      - name: "[BUILD]: Build Angular App"
        working-directory: webapp
        run: pnpm build --configuration production

      - name: "[BUILD]: Create build archive"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd webapp/dist/webapp/browser
          zip -r "$GITHUB_WORKSPACE/webapp-$VERSION.zip" .

      - name: "[AWS]: Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.ARTIFACT_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: "[PUBLISH]: Upload build artifact to S3"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VERSION_TAG: ${{ steps.ver.outputs.version_tag }}
          BUILD_SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          aws s3 cp "webapp-${VERSION}.zip" \
            "s3://${{ vars.ARTIFACT_BUCKET_NAME }}/webapp/${BUILD_SHA}/webapp-${VERSION}.zip" \
            --checksum-algorithm SHA256 \
            --metadata "git-tag=${VERSION_TAG},commit-sha=${BUILD_SHA}"

      # Short-retention GitHub artifact for convenience.
      - name: "[PUBLISH]: Upload build artifact to GitHub"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webapp-${{ steps.ver.outputs.version }}
          path: webapp-${{ steps.ver.outputs.version }}.zip
          retention-days: 3
