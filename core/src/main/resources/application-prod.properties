# Logging
logging.level.ch.swisstopo.monteis.core=WARN
logging.level.springframework.security=WARN

# Extras
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# DB Configuration (JOOQ)
spring.datasource.url=${CORE_META_DB_JDBC_URL}
spring.datasource.username=${CORE_APP_META_DB_USER}
spring.datasource.password=${CORE_APP_META_DB_PWD}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KC_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${KC_AUDIENCE}
# Read-path timing is off by default (see application.properties). Enable it at runtime with
# MONTEIS_OBSERVABILITY_REQUESTTIMING_ENABLED=true. This logger is pinned to INFO so that single
# switch is enough — the rest of the application stays at WARN. Raise it to DEBUG to additionally
# get one line per SQL statement. Nothing is logged while the feature is disabled.
logging.level.ch.swisstopo.monteis.core.infrastructure.observability=INFO
