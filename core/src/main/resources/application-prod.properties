# Logging
logging.level.ch.swisstopo.monteis.core=WARN
logging.level.springframework.security=WARN

# Extras
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# DB Configuration (JOOQ) — cloud uses RDS IAM Auth (no static password)
# The DataSourceConfig @Bean (prod profile) generates an RDS IAM auth token
# at connection time. CORE_APP_META_DB_PWD must NOT be provisioned in cloud.
spring.datasource.url=${CORE_META_DB_JDBC_URL}
spring.datasource.username=${CORE_APP_META_DB_USER}
# No spring.datasource.password here — DataSourceConfig supplies the IAM token.

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KC_JWK_SET_URI}

# Kafka / MSK (SASL_SSL + AWS_MSK_IAM via Pod Identity)
# core -> MSK config: staged for the core Kafka client landing THIS sprint (dev-team confirmed, MON-86). Human-approved deviation from app-code-egress-truth — remove if the Kafka code slips.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL}
spring.kafka.properties.sasl.mechanism=${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM}
# IAMClientCallbackHandler verified against aws-msk-iam-auth 2.3.2 jar class path:
# software.amazon.msk.auth.iam.IAMClientCallbackHandler
spring.kafka.properties.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
spring.kafka.properties.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;

# Actuator probe paths (deterministic — not K8s auto-detection heuristics)
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
# Readiness gates: readinessState + datasource (RDS reachable)
management.endpoint.health.group.readiness.include=readinessState,db
management.server.port=8080