# Contains profile agnostic default settings
spring.application.name=core
server.port=8080

# Spring default profile
spring.profiles.active=prod

# Spring disable auto user generation
spring.security.user.name=none
spring.security.user.password=none

# DB Config
spring.datasource.driver-class-name=org.postgresql.Driver

# Kafka: core only ever produces (SensorParameterConfig on SensorParameter change/create), never consumes.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

app.kafka.topics.sensor-config=internal-sensor-config

# Read-path timing (see infrastructure/observability). Off by default; nothing is registered
# unless enabled, so leaving it here costs nothing. Override per environment, or at runtime with
# MONTEIS_OBSERVABILITY_REQUESTTIMING_ENABLED=true — safe to switch on in production, it adds one
# log line per request and never logs bind parameters.
monteis.observability.request-timing.enabled=false

# Max rows a CSV export (GET .../csv) will stream, regardless of how many rows match the current
# filter - keeps a single export request bounded in both duration and (client-side) buffered size.
app.export.csv.max-rows=50000
monteis.fulcrum.api-token=${FULCRUM_API_TOKEN:}
# Fulcrum Query API (MON-142): read-only source of sensor metadata. The token is a static
# X-ApiToken header value, so it comes from the environment and is empty by default - the
# application still starts without it, requests then fail with 401 rather than at boot.
monteis.fulcrum.base-url=https://api.fulcrumapp-eu.com/api
monteis.fulcrum.sensor-table=Mont Terri Monitoring Systems and Sensors
# experiment documents (MON-171): there is no default bucket and the app does not start without
# one, set it per environment with MONTEIS_DOCUMENTS_S3_BUCKET

# largest document upload, the 413 names this limit to the user. the webapp checks it before
# uploading too (max-document-size.ts). the request limit leaves room for the multipart framing,
# otherwise a file of exactly the limit is refused
# Client-side tiled models (see TileUploadController) can easily exceed Spring's 1MB/10MB defaults.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# Digital twin tileset storage (see ch.swisstopo.monteis.core.modules.visualization). Tiling
# happens entirely client-side (the frontend tiles the uploaded IFC in-browser and POSTs the
# result to TileUploadController) - the backend just stores and serves whatever it's handed, and
# /model/tiles/** stays 503 until something has been uploaded. A relative output-dir is resolved
# against the classpath (see TileOutputDirResolver), i.e. mapped back to
# core/src/main/resources/<output-dir> - NOT against the JVM's working directory, which varies by
# how the app is launched - so uploaded tiles reliably live inside the repo instead of wherever
# the launcher's cwd happened to be.
monteis.tiling.output-dir=tiles

# The tile conversion above writes into src/main/resources, which devtools otherwise watches as a
# classpath resource directory - excluded so writing tiles doesn't trigger a restart loop.
spring.devtools.restart.exclude=tiles/**

# The embedded Tomcat connector enforces its own, independent request-size and part-count caps
# ahead of the spring.servlet.multipart.* properties above - left at their defaults (2MB request
# body, 10 parts), Tomcat rejects a large multi-file tile upload before Spring even sees it, and
# that rejection surfaces as the exact same MaxUploadSizeExceededException, which makes it look
# like the properties above did nothing. <=0 disables each limit.
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
server.tomcat.max-part-count=-1
