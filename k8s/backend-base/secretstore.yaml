apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: REPLACED-IN-OVERLAY
  annotations:
    # wave -2: SecretStore must exist before ExternalSecret (wave -1) and
    # Deployment (wave 0) are reconciled by ArgoCD.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACED-IN-OVERLAY
      # role: scoped per-workload ARN, e.g. arn:aws:iam::<account>:role/monteis/dev/<component>-sm-reader-dev
      # Overlays supply the real ARN via JSON6902 op:replace.
      # MANDATED: each component's SecretStore must reference only its own scoped
      # <component>-sm-reader-dev role — never a shared or cross-component role.
      role: REPLACED-IN-OVERLAY
      # No auth/serviceAccountRef — ESO role-chaining is implicit via the
      # ESO controller's own Pod Identity association. No static credentials.
