apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core-rds
  annotations:
    # Sync-wave -1: after SecretStore (-2) but before Deployment (0).
    # Ensures the K8s Secret exists before the pod starts, satisfying the
    # REL-2 startup gate (secretKeyRef makes the pod not-ready if Secret absent).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # 1 h matches the TimescaleDB ESO posture (NFR-2 / REL-3).
  # Pod credential-refresh on rotation requires a rolling restart (ADR-001):
  # Hikari pools credentials at init; ESO re-syncs the K8s Secret within 1 h
  # but the running datasource pool does not pick up the new value automatically.
  refreshInterval: 1h
  secretStoreRef:
    # Patched to the component-specific SecretStore name in each overlay.
    # Dev overlay patches this to 'core' (the backend-base SecretStore patched name).
    name: REPLACED-IN-OVERLAY
    kind: SecretStore
  target:
    # K8s Secret name (LC-9). ESO owns the lifecycle (creationPolicy: Owner).
    # Dev overlay patches the Deployment env secretKeyRef to this name.
    name: core-rds-credentials
    creationPolicy: Owner
  data:
    # SM secret JSON: {"username":"core_app","password":"<seeded-out-of-band>"}
    # remoteRef.key is REPLACED-IN-OVERLAY; dev overlay patches to
    # monteis-dev/core/rds-credentials
    - secretKey: username
      remoteRef:
        key: REPLACED-IN-OVERLAY
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACED-IN-OVERLAY
        property: password
