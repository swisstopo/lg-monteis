apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: core
  # No namespace here — each overlay's kustomization sets it.
spec:
  ingressClassName: traefik
  # No spec.tls block — TLS terminates at CloudFront (MANDATED).
  # Each new path requires a matching CloudFront behaviour added by the operator.
  rules:
    # host is patched per overlay (op: replace /spec/rules/0/host).
    - host: REPLACED-IN-OVERLAY
      http:
        paths:
          - pathType: Prefix
            path: /api
            backend:
              service:
                name: core
                port:
                  name: http
