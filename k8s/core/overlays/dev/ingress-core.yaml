apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: core
  namespace: monteis-dev
spec:
  ingressClassName: traefik
  # No spec.tls block — TLS terminates at CloudFront (MANDATED).
  # Each new path requires a matching CloudFront behaviour added by the operator.
  rules:
    - host: dev.swisstopo-monteis-test.swisstopo.cloud
      http:
        paths:
          - pathType: Prefix
            path: /api
            backend:
              service:
                name: core
                port:
                  name: http
