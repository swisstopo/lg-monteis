apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pipeline-ts-db
  namespace: monteis-dev
  annotations:
    # wave -1: after SecretStore (wave -2), before Deployment (wave 0).
    # The pipeline pod mounts PIPELINE_APP_TS_DB_PWD via envFrom secretRef;
    # this Secret must exist before the pod starts.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: pipeline
    kind: SecretStore
  target:
    name: pipeline-ts-db
  refreshInterval: 1h
  data:
    - secretKey: PIPELINE_APP_TS_DB_PWD
      remoteRef:
        # The real AWS Secrets Manager key path is supplied by the kustomization.yaml
        # JSON6902 patch (op: replace /spec/data/0/remoteRef/key).
        # Base value is replaced in overlay; written here as REPLACED-IN-OVERLAY
        # so the base secretstore.yaml op:replace is valid.
        key: REPLACED-IN-OVERLAY
