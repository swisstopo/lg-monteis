# Pipeline cloud/prod profile — env vars injected by ConfigMap + ESO Secret at deploy time.
# This profile is activated by spring.profiles.active=prod in application.properties.
# Do NOT hardcode credentials or connection strings here (FORBIDDEN by project rules).

# DB / TimescaleDB (CNPG, always username+password — NOT IAM auth)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
# PIPELINE_APP_TS_DB_PWD is injected via the ESO-synced Secret (pipeline-ts-db),
# not from the ConfigMap. No static password secret in cloud (MANDATED).
spring.datasource.password=${PIPELINE_APP_TS_DB_PWD}

# Kafka / MSK (SASL_SSL + AWS_MSK_IAM via Pod Identity)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL}
spring.kafka.properties.sasl.mechanism=${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM}
# IAMClientCallbackHandler verified against aws-msk-iam-auth 2.3.2 jar class path:
# software.amazon.msk.auth.iam.IAMClientCallbackHandler
spring.kafka.properties.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
spring.kafka.properties.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;

# Actuator probe paths (deterministic — not K8s auto-detection heuristics)
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
# Readiness gates: readinessState + datasource (TimescaleDB reachable) + kafka (MSK reachable)
management.endpoint.health.group.readiness.include=readinessState,db,kafka
management.server.port=8080
