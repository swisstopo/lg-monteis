sonar.organization=swisstopo
sonar.projectKey=swisstopo_lg-monteis
sonar.projectName=lg-monteis

# This disables the rule which marks TODOs as issues
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java

# suppress rule for missing label/id as this is a false positive for material components
sonar.issue.ignore.multicriteria=e2
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S6853
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.html

# suppress legacy rule key for the same missing label/id false positive on material components
sonar.issue.ignore.multicriteria=e3
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.html

sonar.coverage.exclusions=\
  core/src/test/**/*,\
  pipeline/src/test/**/*,\
  webapp/src/app/**/*,\
  **/*Application.java, **/*Config.java,\
  **/dto/**, **/model/**,\

# The ag-grid column definitions are inherently repetitive (field/headerName/sortable/filter per
# column) - this is a false-positive duplication, not something to refactor away.
sonar.cpd.exclusions=webapp/src/app/features/sensor/sensor-table/columns.ts

sonar.sources=webapp/src/app, core/src/main/java, pipeline/src/main/java
sonar.tests=webapp/src/app, core/src/test/java, pipeline/src/test/java
sonar.test.inclusions = webapp/src/app/**/*.spec.ts, core/src/test/java/**/*.java, pipeline/src/test/java/**/*.java
