<div class="metrics-panel">
  <app-table-header (searchAction)="onSearch($event)">
    <button read-action matButton="text" [disabled]="downloading()" (click)="onDownload()">
      @if (downloading()) {
        <mat-spinner diameter="16"></mat-spinner>
      } @else {
        <mat-icon fontIcon="download"></mat-icon>
      }
      {{ 'experiment.tableHeader.download' | translate }}
    </button>

    <button
      write-action
      matButton="tonal"
      color="warn"
      [disabled]="!selectedExperimentId()"
      (click)="onDelete()"
    >
      <mat-icon fontIcon="delete"></mat-icon>
      {{ 'experiment.tableHeader.delete' | translate }}
    </button>

    <button write-action matButton="tonal" (click)="onCreate()">
      <mat-icon fontIcon="add"></mat-icon>
      {{ 'experiment.tableHeader.create' | translate }}
    </button>

    <button write-action matButton="filled" [disabled]="!selectedExperimentId()" (click)="onEdit()">
      <mat-icon fontIcon="edit"></mat-icon>
      {{ 'experiment.tableHeader.edit' | translate }}
    </button>
  </app-table-header>
  @if (loadError()) {
    <app-inline-error [message]="'experiment.error.connection' | translate"></app-inline-error>
  } @else {
    <app-table
      class="custom-grid"
      [checkboxes]="true"
      [multiple]="false"
      [columns]="wrappedCols"
      [rowModelType]="'infinite'"
      [datasource]="datasource"
      [gridOptions]="gridOptions"
      [getRowId]="getExperimentRowId"
      (rowClicked)="onWrappedRow($event)"
      (selectionChanged)="onSelectionChanged($event)"
      (gridReady)="onGridReady($event)"
    >
    </app-table>
  }
</div>
