<div class="metrics-panel">
  <app-table-header
    (searchAction)="onSearch($event)"
    [canWriteConditional]="permissions.hasAnyExperimentWriteAccess()"
  >
    <button read-action matButton="text" [disabled]="downloading()" (click)="onDownload()">
      @if (downloading()) {
        <mat-spinner diameter="16"></mat-spinner>
      } @else {
        <mat-icon fontIcon="download"></mat-icon>
      }
      {{ 'experiment.tableHeader.download' | translate }}
    </button>

    <button write-action matButton="tonal" (click)="onCreate()">
      <mat-icon fontIcon="add"></mat-icon>
      {{ 'experiment.tableHeader.create' | translate }}
    </button>

    <button
      conditional-write-action
      matButton="tonal"
      [disabled]="!canEditSelected()"
      (click)="onEdit()"
    >
      <mat-icon fontIcon="edit"></mat-icon>
      {{ 'experiment.tableHeader.edit' | translate }}
    </button>

    <button
      primary-action
      matButton="filled"
      [disabled]="selectedExperimentId() === undefined"
      (click)="onView()"
    >
      <mat-icon fontIcon="visibility"></mat-icon>
      {{ 'experiment.tableHeader.view' | translate }}
    </button>
  </app-table-header>
  @if (loadError()) {
    <app-inline-error [message]="'experiment.error.connection' | translate"></app-inline-error>
  } @else {
    <app-table
      class="custom-grid"
      [checkboxes]="true"
      [multiple]="false"
      [columns]="wrappedCols"
      [rowModelType]="'infinite'"
      [datasource]="datasource"
      [gridOptions]="gridOptions"
      [getRowId]="getExperimentRowId"
      (selectionChanged)="onSelectionChanged($event)"
      (gridReady)="onGridReady($event)"
    >
    </app-table>
  }
</div>
