<section class="experiment-owner-list" data-testid="experiment-owner-list">
  <h3 class="experiment-owner-list_title">{{ 'experiment.owners.label' | translate }}</h3>
  @if (unavailable()) {
    <p data-testid="owners-unavailable">{{ 'experiment.owners.unavailable' | translate }}</p>
  } @else {
    @for (owner of owners(); track owner.id) {
      <p class="experiment-owner-list_owner" data-testid="experiment-owner">
        <span>{{ displayName(owner) }}</span>
        @if (owner.email) {
          <a [href]="'mailto:' + owner.email">{{ owner.email }}</a>
        }
      </p>
    } @empty {
      <p data-testid="no-owners">{{ 'experiment.owners.none' | translate }}</p>
    }
  }
</section>
