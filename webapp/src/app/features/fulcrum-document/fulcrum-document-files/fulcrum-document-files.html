@if (removedKey(); as removedKey) {
  <mat-icon
    class="removed"
    data-testid="removed-from-fulcrum"
    fontIcon="cloud_off"
    [matTooltip]="removedKey | translate"
    [attr.aria-label]="removedKey | translate"
  ></mat-icon>
}
@if (permissions.canAccessDocuments()) {
  @if (files().length === 1) {
    @let file = files()[0];
    @if (file.stored && file.viewable) {
      <button
        mat-icon-button
        type="button"
        data-testid="view-file"
        [attr.aria-label]="'fulcrumDocument.files.view' | translate: { fileName: file.fileName }"
        [matTooltip]="'fulcrumDocument.files.view' | translate: { fileName: file.fileName }"
        (click)="view(file)"
      >
        <mat-icon fontIcon="visibility"></mat-icon>
      </button>
    }
    @if (file.stored) {
      <button
        mat-icon-button
        type="button"
        data-testid="download-file"
        [attr.aria-label]="
          'fulcrumDocument.files.download' | translate: { fileName: file.fileName }
        "
        [matTooltip]="'fulcrumDocument.files.download' | translate: { fileName: file.fileName }"
        (click)="download(file)"
      >
        <mat-icon fontIcon="download"></mat-icon>
      </button>
    }
  } @else if (files().length > 1) {
    <button
      mat-icon-button
      type="button"
      data-testid="files-menu"
      [attr.aria-label]="'fulcrumDocument.files.menu' | translate: { count: files().length }"
      [matTooltip]="'fulcrumDocument.files.menu' | translate: { count: files().length }"
      [matMenuTriggerFor]="filesMenu"
    >
      <mat-icon fontIcon="attach_file"></mat-icon>
    </button>
    <mat-menu #filesMenu="matMenu">
      @for (file of files(); track file.id) {
        <button
          mat-menu-item
          type="button"
          data-testid="file-entry"
          [disabled]="!file.stored"
          [matMenuTriggerFor]="fileActions"
          [matMenuTriggerData]="{ file }"
        >
          @if (!file.availableInFulcrum) {
            <mat-icon
              data-testid="file-removed-from-fulcrum"
              fontIcon="cloud_off"
              [matTooltip]="'fulcrumDocument.removed.file' | translate"
              [attr.aria-label]="'fulcrumDocument.removed.file' | translate"
            ></mat-icon>
          } @else {
            <mat-icon fontIcon="description"></mat-icon>
          }
          <span class="file-name">{{ file.fileName }}</span>
        </button>
      }
    </mat-menu>
    <mat-menu #fileActions="matMenu">
      <ng-template matMenuContent let-file="file">
        @if (file.viewable) {
          <button mat-menu-item type="button" data-testid="view-file" (click)="view(file)">
            <mat-icon fontIcon="visibility"></mat-icon>
            <span>{{ 'fulcrumDocument.files.viewAction' | translate }}</span>
          </button>
        }
        <button mat-menu-item type="button" data-testid="download-file" (click)="download(file)">
          <mat-icon fontIcon="download"></mat-icon>
          <span>{{ 'fulcrumDocument.files.downloadAction' | translate }}</span>
        </button>
      </ng-template>
    </mat-menu>
  }
}
