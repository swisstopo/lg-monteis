@if (entry(); as entry) {
  @if (!entry.availableInFulcrum) {
    <mat-icon
      class="removed"
      data-testid="removed-from-fulcrum"
      fontIcon="cloud_off"
      [matTooltip]="'fulcrumEntry.removed' | translate"
      [attr.aria-label]="'fulcrumEntry.removed' | translate"
    ></mat-icon>
  }
  @if (permissions.canAccessDocuments()) {
    @let fileName = entry.document.fileName;
    @if (entry.document.viewable) {
      <button
        mat-icon-button
        type="button"
        data-testid="view-document"
        [attr.aria-label]="'fulcrumEntry.document.view' | translate: { fileName }"
        [matTooltip]="'fulcrumEntry.document.view' | translate: { fileName }"
        (click)="view(entry)"
      >
        <mat-icon fontIcon="visibility"></mat-icon>
      </button>
    }
    <button
      mat-icon-button
      type="button"
      data-testid="download-document"
      [attr.aria-label]="'fulcrumEntry.document.download' | translate: { fileName }"
      [matTooltip]="'fulcrumEntry.document.download' | translate: { fileName }"
      (click)="download(entry)"
    >
      <mat-icon fontIcon="download"></mat-icon>
    </button>
  }
}
