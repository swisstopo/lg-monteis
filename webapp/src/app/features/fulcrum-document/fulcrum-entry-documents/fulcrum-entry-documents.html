@if (removedKey(); as removedKey) {
  <mat-icon
    class="removed"
    data-testid="removed-from-fulcrum"
    fontIcon="cloud_off"
    [matTooltip]="removedKey | translate"
    [attr.aria-label]="removedKey | translate"
  ></mat-icon>
}
@if (permissions.canAccessDocuments()) {
  @if (documents().length === 1) {
    @let document = documents()[0];
    @if (document.viewable) {
      <button
        mat-icon-button
        type="button"
        data-testid="view-document"
        [attr.aria-label]="
          'fulcrumEntry.documents.view' | translate: { fileName: document.fileName }
        "
        [matTooltip]="'fulcrumEntry.documents.view' | translate: { fileName: document.fileName }"
        (click)="view(document)"
      >
        <mat-icon fontIcon="visibility"></mat-icon>
      </button>
    }
    <button
      mat-icon-button
      type="button"
      data-testid="download-document"
      [attr.aria-label]="
        'fulcrumEntry.documents.download' | translate: { fileName: document.fileName }
      "
      [matTooltip]="'fulcrumEntry.documents.download' | translate: { fileName: document.fileName }"
      (click)="download(document)"
    >
      <mat-icon fontIcon="download"></mat-icon>
    </button>
  } @else if (documents().length > 1) {
    <button
      mat-icon-button
      type="button"
      data-testid="documents-menu"
      [attr.aria-label]="'fulcrumEntry.documents.menu' | translate: { count: documents().length }"
      [matTooltip]="'fulcrumEntry.documents.menu' | translate: { count: documents().length }"
      [matMenuTriggerFor]="documentsMenu"
    >
      <mat-icon fontIcon="attach_file"></mat-icon>
    </button>
    <mat-menu #documentsMenu="matMenu">
      @for (document of documents(); track document.id) {
        <button
          mat-menu-item
          type="button"
          data-testid="document-item"
          [matMenuTriggerFor]="documentActions"
          [matMenuTriggerData]="{ document }"
        >
          @if (!document.availableInFulcrum) {
            <mat-icon
              data-testid="document-removed-from-fulcrum"
              fontIcon="cloud_off"
              [matTooltip]="'fulcrumEntry.removed.document' | translate"
              [attr.aria-label]="'fulcrumEntry.removed.document' | translate"
            ></mat-icon>
          } @else {
            <mat-icon fontIcon="description"></mat-icon>
          }
          <span class="file-name">{{ document.fileName }}</span>
        </button>
      }
    </mat-menu>
    <mat-menu #documentActions="matMenu">
      <ng-template matMenuContent let-document="document">
        @if (document.viewable) {
          <button mat-menu-item type="button" data-testid="view-document" (click)="view(document)">
            <mat-icon fontIcon="visibility"></mat-icon>
            <span>{{ 'fulcrumEntry.documents.viewAction' | translate }}</span>
          </button>
        }
        <button
          mat-menu-item
          type="button"
          data-testid="download-document"
          (click)="download(document)"
        >
          <mat-icon fontIcon="download"></mat-icon>
          <span>{{ 'fulcrumEntry.documents.downloadAction' | translate }}</span>
        </button>
      </ng-template>
    </mat-menu>
  }
}
