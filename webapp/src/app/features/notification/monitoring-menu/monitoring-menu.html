<div class="side-panel-container">
  <h3 class="section-title">{{ 'menu.notifications' | translate }}</h3>
  @for (experiment of writableExperiments.value() ?? []; track experiment.id) {
    <app-route-button
      data-testid="monitoring-menu-notifications-entry"
      [route]="['/monitoring', experiment.id!]"
      [label]="'menu.notificationsOf' | translate: { name: experiment.name }"
    ></app-route-button>
  }
</div>
