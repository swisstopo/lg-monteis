<div class="metrics-panel">
  <h2 class="panel-heading">{{ 'measurements.heading' | translate }}</h2>

  @if (metricsResource.isLoading()) {
    <div class="loading-container">
      <p class="loading-text">{{ 'measurements.loading' | translate }}</p>
    </div>
  } @else if (metricsResource.error()) {
    <p class="error-text">{{ 'measurements.error' | translate }}</p>
  } @else {
    <app-table
      class="custom-grid"
      [rows]="metricsResource.value() ?? []"
      [columns]="wrappedCols"
      (rowClicked)="onWrappedRow($event)"
    >
    </app-table>
  }
</div>
