<div class="metrics-panel">
  <app-table-header entityName="sensor" (searchAction)="onSearch($event)">
    <button matButton="text" (click)="onDownload()">
      <mat-icon fontIcon="download"></mat-icon>
      {{ 'sensor.tableHeader.download' | translate }}
    </button>

    <button matButton="tonal" (click)="onCreate()">
      <mat-icon fontIcon="add"></mat-icon>
      {{ 'sensor.tableHeader.create' | translate }}
    </button>

    <button matButton="filled" [disabled]="!selectedSensorId()" (click)="onEdit()">
      <mat-icon fontIcon="edit"></mat-icon>
      {{ 'sensor.tableHeader.edit' | translate }}
    </button>
  </app-table-header>
  @if (loadError()) {
    <p class="error-text">{{ 'sensor.error.connection' | translate }}</p>
  } @else {
    <app-table
      class="custom-grid"
      [checkboxes]="true"
      [multiple]="false"
      [columns]="wrappedCols"
      [rowModelType]="'infinite'"
      [datasource]="datasource"
      [gridOptions]="{ domLayout: 'normal' }"
      [getRowId]="getSensorRowId"
      (rowClicked)="onWrappedRow($event)"
      (selectionChanged)="onSelectionChanged($event)"
      (gridReady)="onGridReady($event)"
    >
    </app-table>
  }
</div>
