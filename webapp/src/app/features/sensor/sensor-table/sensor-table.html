<div class="metrics-panel">
  <app-table-header [selectedSensorId]="selectedSensorId()"></app-table-header>
  @if (sensorService.error()) {
    <p class="error-text">Failed to connect to the backend server.</p>
  } @else {
    <app-table
      class="custom-grid"
      [checkboxes]="true"
      [multiple]="true"
      [rows]="sensorService.allSensors.value() ?? []"
      [columns]="wrappedCols"
      (rowClicked)="onWrappedRow($event)"
      (selectionChanged)="onSelectionChanged($event)"
    >
    </app-table>
  }
</div>
