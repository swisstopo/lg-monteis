<div class="metrics-panel">
  <app-table-header
    entityName="sensor"
    [selectedItemId]="selectedSensorId()"
    [dialogComponent]="SensorEdit"
    [searchAction]="onSearch"
    [showCreate]="true"
    [showDownload]="true"
    [showEdit]="true"
  />
  @if (loadError()) {
    <p class="error-text">{{ 'sensor.error.connection' | translate }}</p>
  } @else {
    <app-table
      class="custom-grid"
      [checkboxes]="true"
      [multiple]="false"
      [columns]="wrappedCols"
      [rowModelType]="'infinite'"
      [datasource]="datasource"
      [gridOptions]="{ domLayout: 'normal' }"
      [getRowId]="getSensorRowId"
      (rowClicked)="onWrappedRow($event)"
      (selectionChanged)="onSelectionChanged($event)"
      (gridReady)="onGridReady($event)"
    >
    </app-table>
  }
</div>
