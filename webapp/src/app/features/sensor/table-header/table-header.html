<div class="table-header">
  <mat-form-field class="search-field" appearance="fill" subscriptSizing="dynamic">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput type="search" [placeholder]="'sensor.tableHeader.search' | translate" />
  </mat-form-field>

  <button matButton="text" (click)="onDownload()">
    <mat-icon fontIcon="download"></mat-icon>
    {{ 'sensor.tableHeader.download' | translate }}
  </button>

  @if (permissions.canWrite()) {
    <button matButton="tonal" (click)="onCreate()">
      <mat-icon fontIcon="add"></mat-icon>
      {{ 'sensor.tableHeader.create' | translate }}
    </button>

    <button matButton="filled" [disabled]="selectedSensorId() === undefined" (click)="onEdit()">
      <mat-icon fontIcon="edit"></mat-icon>
      {{ 'sensor.tableHeader.edit' | translate }}
    </button>
  }

  <button matButton="filled" [disabled]="selectedSensorId() === undefined" (click)="onPlot()">
    <mat-icon fontIcon="add_chart"></mat-icon>
    {{ 'sensor.tableHeader.plot' | translate }}
  </button>
</div>
