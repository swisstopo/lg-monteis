<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content>{{ message() }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <app-dismiss-button />
  <button matButton="filled" type="button" class="confirm" [mat-dialog-close]="true">
    <mat-icon fontIcon="delete" />
    {{ confirmLabel() }}
  </button>
</mat-dialog-actions>
